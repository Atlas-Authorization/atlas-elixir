name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"
      - run: mix deps.get
      - run: mix test
  generated:
    # lib/atlas/resources, resource_index.ex and test/fixtures/operations.txt must match
    # scripts/openapi.snapshot.json and scripts/name_pins.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and fail on any diff
        run: |
          set -euo pipefail
          python3 -I scripts/generate.py
          git diff --exit-code -- lib test/fixtures scripts/name_pins.json || { echo "::error::generated files are out of date: run python3 scripts/generate.py"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all -- lib test/fixtures)" || { echo "::error::generated files are not committed"; exit 1; }
